[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-workstation"
version = "0.1.0"
description = "Local, approval-gated investment research and paper trading"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
ws = "workstation.cli:main"

[tool.setuptools.packages.find]
include = ["workstation*"]

[tool.setuptools.package-data]
workstation = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
